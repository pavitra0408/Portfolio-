312 353.984375 372.117188 351.417969 376.507812 C 348.851562 380.902344 345.371094 384.382812 340.976562 386.949219 C 336.582031 389.515625 331.703125 390.800781 326.335938 390.800781 "/><path d="M 334.535156 361.925781 C 334.535156 366.457031 330.863281 370.128906 326.335938 370.128906 C 321.804688 370.128906 318.132812 366.457031 318.132812 361.925781 C 318.132812 357.398438 321.804688 353.726562 326.335938 353.726562 C 330.863281 353.726562 334.535156 357.398438 334.535156 361.925781 "/></g></g></g><g class="lgf" opacity="0"><rect x="-34" y="-34" width="68" height="68" rx="4" fill="none" stroke="#0A0F2C" stroke-width=".9"/></g></g></svg><div class="st"><b>01</b> / 07</div><div class="cap"><p>Everything starts with a single dot.</p><p>A ring is drawn around it.</p><p>The proportions: ring 2, space 4, dot 3, space 4, ring 2.</p><p>Other versions I tried: open rings, and dots of different sizes.</p><p>I kept the one with the dot centred in the ring.</p><p>It takes the place of the O in ARCEON.</p><p>Clear space is one O, on every side.</p></div><i class="bar"></i></div></div>`;

<div class="cm arn" style="width:100%;height:min(44svh,420px);margin-top:24px;border-radius:6px;overflow:hidden;background:#fff"><div style="width:min(44%,560px)">${lgR}</div></div>
<div class="hd2" data-mv="wu" style="margin-top:28px;transition-delay:1.5s"><h1 style="font-size:clamp(44px,7vw,128px)">Design<br>with purpose.</h1></div>
<p class="sub" data-mv="wl" style="transition-delay:1.75s;max-width:46ch;font-size:clamp(18px,1.8vw,24px);color:var(--ink);font-weight:200">ARCEON is an identity for a digital experience design studio. A concept brand, built carefully enough to open for real.</p>
<div class="facts"><div><small>Role</small>${p.role}</div><div><small>Type</small>${p.fmt}</div><div><small>Year</small>${p.yr}</div><div><small>Deliverable</small>Logo system, colour, type, voice</div></div>
<nav class="cxj" aria-label="Case study sections"><span>Jump to</span><button type="button" data-jump="1">Idea</button><button type="button" data-jump="2">Construction</button><button type="button" data-jump="6">System</button><button type="button" data-jump="10">Application</button></nav>

${R(1,'The idea',`<p class="dlq">Every brand has a problem. Most never get it solved properly.</p><p style="margin-top:28px">ARCEON is a studio that thinks before it designs. It asks why before it asks how. It sits between a freelancer and a large agency: more structured than the first, more personal than the second.</p><ol class="pr" style="margin-top:32px"><li><b>1</b><span><strong>Problem first. Design second.</strong> Understand the problem before opening a file.</span></li><li><b>2</b><span><strong>Process is how good work happens.</strong> It is not a formality.</span></li><li><b>3</b><span><strong>Details are the work.</strong> Nothing leaves without being checked.</span></li></ol>`)}
${R(2,'The logo',`<h2>How it is built.</h2><p>Scroll to build it, from one dot to the full logo and the space around it.</p>`)}
${LGS}
${R(3,'The mark',`<h2>One letter in colour.</h2><p>Six black letters, and one navy O. The O is a ring around a dot: the point you look at once the problem is clear. Because it is the only colour in the logo, it is where the eye lands. It stands for the studio's method, and it works alone when there is no room for the name.</p><div class="vt" style="margin-top:32px">${vt('#FFFFFF','#0D0D0D','#0A0F2C','Primary logo',1)}<div style="background:#0A0F2C;border-color:transparent">${mk('#FFFFFF','style="width:22%"')}<span>Standalone mark</span></div></div><figure style="margin:12px 0 0"><img src="${IMG.arcMarks}" alt="The standalone mark as favicon, app icon, social profile and embossing, on dark and light" loading="lazy" decoding="async" style="width:100%;display:block;border-radius:6px"><figcaption style="font-size:13px;color:var(--mute);margin-top:10px">Where the mark stands alone: favicon, app icon, social profile and emboss.</figcaption></figure>`)}

${R(6,'Versions',`<h2>One logo, four inks.</h2><p>The primary logo is black letters with a navy O. Where one colour is needed, it goes all navy, all black, or all white on a dark ground. Contrast does the work, so nothing else is added.</p><div class="vt" style="margin-top:32px">${vt('#FFFFFF','#0D0D0D','#0A0F2C','Primary on white',1)}${vt('#FFFFFF','#0A0F2C','#0A0F2C','Navy on white',1)}${vt('#0A0F2C','#FFFFFF','#FFFFFF','White on navy',0)}${vt('#0D0D0D','#FFFFFF','#FFFFFF','White on black',0)}</div><h3 style="font-weight:300;font-size:13px;color:var(--mute);margin:44px 0 0">Never</h3><div class="nv">${nv('Stretch','style="width:62%;transform:scaleX(1.4)"')}${nv('Rotate','style="width:62%;transform:rotate(-12deg)"')}${nv('Recolour','style="width:62%"','#E8590C','#E8590C')}${nv('Outline','style="width:62%;stroke:#0A0F2C;stroke-width:.9"','none','none')}${nv('Add effects','style="width:62%;filter:drop-shadow(6px 8px 5px rgba(0,0,0,.55))"')}<div data-mv="no"><div style="width:62%;display:grid;gap:2px">${lg('#0D0D0D','#0A0F2C')}<b style="font:400 15px Outfit,sans-serif;color:#0A0F2C;letter-spacing:.04em">DIGITAL EXPERIENCE STUDIO</b></div><span>✕ Crowd it</span><i class="xx" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M10 78L90 22"/></svg></i></div></div>`)}
${R(7,'Colour',`<h2>Three colours. The work does the talking.</h2><p>White is the ground, black carries the text, and deep navy takes the accent and the dark pages. White on navy reads at 18.8 to 1.</p><div class="swg">${sw('#FFFFFF','#0D0D0D','White','#FFFFFF','255 255 255','Primary background')}${sw('#0D0D0D','#FFFFFF','Black','#0D0D0D','13 13 13','Primary text')}${sw('#0A0F2C','#FFFFFF','Deep Navy','#0A0F2C','10 15 44','Accent and dark pages')}</div>`)}
${R(8,'Type',`<h2>Two typefaces. A complete system.</h2><p>Neue Montreal and Outfit. A grotesque for clarity and a geometric sans that echoes the drawn O.</p><figure style="margin:32px 0 0"><img src="${IMG.arcType}" alt="Type specimen: Neue Montreal and Outfit" loading="lazy" decoding="async" style="width:100%;display:block;border-radius:6px"></figure>`)}

 const R=(n,l,body,tight)=>`<section class="dlr"${tight?' style="padding-bottom:36px"':''}><div class="dll"><b>${pad(n)}</b>${l}</div><div class="dlc">${body}</div></section>`;

 const wfs=['up','det','stop','set'],wfc=[['Recurring','What leaves, in date order. What needs you is first.'],['Payment','The balance next to the amount, and one clear next step.'],['Stop sheet','What stops and what does not, before you commit.'],['Alerts','Quiet by default. One threshold you can change.']];

<div class="hd2"><h1 style="font-size:clamp(44px,9vw,150px)">Know before<br>it leaves.</h1></div>
<p class="sub" style="max-width:46ch;font-size:clamp(18px,1.8vw,24px);color:var(--ink);font-weight:200">Recurring: a concept for a bank app that shows every card and UPI payment before it leaves your account, and lets you decide in time.</p>
<div class="facts"><div><small>Role</small>${p.role}</div><div><small>Type</small>${p.fmt}</div><div><small>Year</small>${p.yr}</div><div><small>Tools</small>Interactive prototype</div></div>

<p style="text-align:center;margin-top:36px;font-size:13px;color:var(--mute)">A concept. Not affiliated with any bank, and the people, balances and payments shown are sample data.</p>
${R(1,'The problem',`<p class="dlq">I bought a one-year plan for about ₹19,000. I set a reminder to cancel it. I still didn't.</p><p style="margin-top:28px">The bank's notice arrived 24 hours before the debit, on a day my account was short. The SMS linked to a website, and cancelling took two more steps there. It was annoying enough that I put it off.</p><!-- [ADD OUTCOME: was it charged, or did it fail?] --><div class="note">The small ones I want to keep: YouTube Premium, music, iCloud. I don't want to cancel them. I just want to know before they leave.</div>`)}
${R(2,'The rules',`<h2>The minimum is 24 hours. Nothing asks for more.</h2><p>RBI's e-mandate framework sets what a bank has to do for recurring payments. It is a floor, and it leaves room to design above it.</p><div class="big">${stat('24 h','minimum pre-debit notice, with merchant, amount and date')}${stat('₹15,000','recurring debits up to this need no fresh OTP')}${stat('₹1 lakh','the same limit for insurance, mutual funds and card bills')}${stat('Any time','you can cancel a mandate or opt out of one payment')}</div><div class="note">Figures from a published summary of the framework: <a href="https://www.iasgyan.in/daily-current-affairs/rbis-e-mandate-framework-2026-explained" style="color:var(--ink);border-bottom:1px solid var(--line)">IAS Gyan</a>. The RBI circular is the source of record.</div>`)}
${R(3,'What the apps show',`<h2>A list of ceilings, not a list of dates.</h2><p>This is the Autopay screen in Google Pay, on my phone. It has seven mandates and a good deal of detail. It still can't answer the one question I have: what leaves next, and how much?</p><div class="rcau"><figure class="rcv"><img src="${IMG.rcPay1}" alt="Google Pay Automatic payments screen showing Apple, Clanflare and Netflix mandates with Up to amounts and As presented" loading="lazy" decoding="async"><i class="pn" style="left:60%;top:43.4%">1</i><i class="pn" style="left:66%;top:47%">2</i><i class="pn" style="left:84%;top:49.6%">3</i><i class="pn" style="left:72%;top:21.2%">4</i></figure><figure class="rcv d1"><img src="${IMG.rcPay2}" alt="The same screen scrolled, showing five Apple mandates with similar names" loading="lazy" decoding="async"><i class="pn" style="left:57%;top:61%">5</i></figure></div>
<ol class="leg"><li><b>1</b><span>Names like "Create Mandate" and "MERCHANTMAND…". Five of the seven are Apple, and nothing says which is iCloud, which is Music.</span></li><li><b>2</b><span>"Up to ₹1,999, as presented" is a ceiling the merchant may charge. It is not the next amount.</span></li><li><b>3</b><span>A green tick and "29 payments completed" describe the past. No row says when money leaves next.</span></li><li><b>4</b><span>"Set up once and never miss a deadline" sells set-and-forget. That is how a yearly payment gets lost.</span></li><li><b>5</b><span>No total for the month, and no grouping by what needs me.</span></li></ol>
<div class="note">The ₹19,000 plan isn't on this list. It was a card payment, and this screen only covers UPI. UPI apps and the bank each show their own part.</div>`)}
${R(4,'The reframe',`<h2>Two gaps, three situations.</h2><p>Nobody sees every recurring payment in one place, and the warning comes too late to act on. Both show up in these three situations. Two come from my own phone and one from reporting.</p><div class="rcsc"><div class="rcv"><h3>The yearly renewal</h3><small>From my own experience</small><p>A large payment I forgot, on a day the balance couldn't cover it.</p><p><b>Needs</b>A warning a week early, the balance beside the amount, and a way to act in the same place.</p></div><div class="rcv d1"><h3>The ones I keep</h3><small>From my own experience</small><p>Music, video and storage. I'm glad to pay. I only want to see them coming.</p><p><b>Needs</b>Quiet. A weekly note, not an alarm for every ₹75.</p></div><div class="rcv d2"><h3>The trial that stays</h3><small>Reported by <a href="https://the-ken.com/kaching/dark-patterns-shadow-upi-autopays-ascent/" style="color:var(--ink);border-bottom:1px solid var(--line)">The Ken</a></small><p>A ₹1 trial, cancelled within weeks, followed by a ₹199 charge. The bank's SMS was missed each time.</p><p><b>Needs</b>The real recurring amount shown at the moment of approval, and a flag on the first charge.</p></div></div><p class="dlq" style="margin-top:56px">How might a bank app show every payment before it leaves, early enough to decide, and without crying wolf?</p>`)}
${R(5,'The rules I set',`<h2>Six rules for the design.</h2><ol class="pr"><li><b>1</b><span><strong>Early, then quiet.</strong> Alert by consequence, not by calendar. A ₹75 payment and a ₹19,000 payment should not make the same noise.</span></li><li><b>2</b><span><strong>Show the consequence.</strong> "Short by ₹14,790" says more than "Payment due".</span></li><li><b>3</b><span><strong>The notice opens the decision.</strong> One tap lands on the payment with the facts loaded. No SMS link to a website.</span></li><li><b>4</b><span><strong>Name things by what they are.</strong> iCloud+, not "Create Mandate". One list for card and UPI together.</span></li><li><b>5</b><span><strong>Keeping is a real choice.</strong> Most of these are wanted. "Keep it" is the default when the balance covers the payment.</span></li><li><b>6</b><span><strong>Be honest about what stopping does.</strong> The bank can stop a debit. The merchant may still end your plan, and the screen says so.</span></li></ol>`)}
${R(6,'Alerts',`<h2>Quiet by default.</h2><p>This is the hard part of the design. A week's notice for every payment would be muted within a month. So the system chooses by what's at stake. Pick a payment to see what happens in the weeks before it.</p>`,1)}

${R(10,'The design system',`<h2>Calm, plain and unmistakable.</h2><p>A bank app should feel steady. Colour is used for meaning and not for decoration: blue for action, amber for a heads-up, red only for a payment that will fail, green for covered. Every pair is checked against WCAG AA.</p><div class="rcs"><div style="background:#0B5C8E;color:#fff"><b>Blue</b>#0B5C8E · actions<br>7.2:1 with white</div><div style="background:#FFF1D6;color:#7A4600"><b>Amber</b>#7A4600 on #FFF1D6<br>7.0:1 · a heads-up</div><div style="background:#FDE7E5;color:#9A1B12"><b>Red</b>#9A1B12 on #FDE7E5<br>7.0:1 · will fail</div><div style="background:#E3F3E9;color:#1B6B43"><b>Green</b>#1B6B43 on #E3F3E9<br>5.7:1 · covered</div></div><div class="rcty"><div><small>TYPE · OUTFIT</small><div style="font-weight:300;font-size:34px;letter-spacing:-.03em">₹19,000</div><div style="font-weight:400;font-size:15px;margin-top:8px">Payment names, 15</div><div style="font-size:12px;color:var(--mute);margin-top:4px">Details and dates, 12</div></div><div><small>RULES</small><div style="font-size:14px;color:var(--mute);line-height:1.7">44 pt minimum touch targets.<br>Status is never colour alone: every chip has words.<br>A 4-point grid. 14 px radius on cards, 99 px on chips.<br>Amounts are always shown with the rupee sign and Indian grouping.</div></div></div>`)}

<p class="sub" style="max-width:46ch;font-size:clamp(18px,1.8vw,24px);color:var(--ink);font-weight:200">DigiLocker 2.0: a concept for applying for, tracking and keeping India's essential documents in one trusted place.</p>

${R(1,'The problem',`<p class="dlq">To change an address, apply for a PAN or renew a licence, you visit four different websites.</p><div class="ports"><div>UIDAI<small>Aadhaar</small></div><div>Protean / NSDL<small>PAN</small></div><div>Passport Seva<small>Passport</small></div><div>Parivahan<small>Driving licence</small></div></div><p style="margin-top:28px">Each has its own login, its own form and its own upload rules, and each asks for the same details again. DigiLocker already holds the verified documents. It just cannot apply for them.</p>`)}

${R(4,'What I took from it',`<h2>Six rules for the design.</h2><ol class="pr"><li><b>1</b><span><strong>Trust first.</strong> Government branding, a plain privacy note and a consent receipt on every share.</span></li><li><b>2</b><span><strong>Share only what is needed.</strong> People see what is shared, with whom and why.</span></li><li><b>3</b><span><strong>Speak the user's language.</strong> Hindi, English and local languages, with voice help.</span></li><li><b>4</b><span><strong>Big, plain, few.</strong> Large buttons, simple words, no more than five steps.</span></li><li><b>5</b><span><strong>Work without a signal.</strong> Drafts are saved on the phone and sent when the network returns.</span></li><li><b>6</b><span><strong>Help is a person too.</strong> A QR code hands the form to a Jan Seva Kendra operator.</span></li></ol><figure style="margin:36px 0 0"><img src="${IMG.pPair}" alt="The language screen in Hindi and English on two phones" loading="lazy" decoding="async" style="width:100%;display:block;border-radius:6px"><figcaption style="font-size:13px;color:var(--mute);margin-top:10px">Rules 3 and 4 on screen: language first, then big plain choices.</figcaption></figure><h3 style="font-weight:300;font-size:13px;color:var(--mute);margin:40px 0 0">Where the design leans on known UX laws</h3><table class="tbl"><tr><th>Law</th><th>What I did with it</th></tr><tr><td>Hick's law</td><td>Four choices on home, not nine. One action per screen.</td></tr><tr><td>Fitts's law</td><td>Main tap targets are at least 56px tall, small utilities 44px. The main action sits at the bottom, under the thumb.</td></tr><tr><td>Miller's law</td><td>Five steps, each with one group of information.</td></tr><tr><td>Jakob's law</td><td>Bottom tabs and a stepper, patterns people already know from banking and delivery apps.</td></tr><tr><td>Doherty threshold</td><td>Every tap answers at once. With no network, the form says it is saved and will be sent.</td></tr><tr><td>Peak-end rule</td><td>The end is the part people remember, so it gets a clear "Submitted", a tracking ID and a consent receipt.</td></tr></table>`)}
${R(5,'Navigation',`<h2>Nine sections became four.</h2><p>The first site map had nine top-level sections and an admin portal. For someone using a phone for the first time, that is a maze. Everything a citizen does now sits behind four large choices. Settings, privacy and language live under one profile menu.</p><div class="ia" style="overflow-x:auto;margin-top:36px"><svg class="svgd" viewBox="0 0 900 600" role="img" aria-label="Where the nine original sections and the admin portal went: four choices on Home, a profile menu, and a separate department portal" style="min-width:780px;width:100%;height:auto"><text class="t3" x="0" y="16">BEFORE · 9 SECTIONS + ADMIN</text><text class="t3" x="620" y="16">AFTER · FOUR CHOICES, ONE MENU</text><path class="ln" d="M270,63 C445,63 445,66 620,66" fill="none"/><path class="ln" d="M270,119 C445,119 445,116 620,116" fill="none"/><path class="ln" d="M270,175 C445,175 445,175 620,175" fill="none"/><path class="ln" d="M270,231 C445,231 445,231 620,231" fill="none"/><path class="ln" d="M270,287 C445,287 445,290 620,290" fill="none"/><path class="ln" d="M270,343 C445,343 445,340 620,340" fill="none"/><path class="ln" d="M270,399 C445,399 445,400 620,400" fill="none"/><path class="ln" d="M270,455 C445,455 445,455 620,455" fill="none"/><path class="ln" d="M270,511 C445,511 445,510 620,510" fill="none"/><path class="ln" d="M270,567 C445,567 445,567 620,567" fill="none" stroke-dasharray="5 4" opacity=".55"/><rect class="bx" x="0" y="40" width="270" height="46" rx="6"/><text class="t1" x="14" y="60">Apply for Documents</text><text class="t2" x="14" y="78">Aadhaar · PAN · Passport · Licence · Other</text><rect class="bx" x="0" y="96" width="270" height="46" rx="6"/><text class="t1" x="14" y="116">Application Wizard</text><text class="t2" x="14" y="134">7 steps</text><rect class="bx" x="0" y="152" width="270" height="46" rx="6"/><text class="t1" x="14" y="172">My Locker</text><text class="t2" x="14" y="190">Categories · Document details</text><rect class="bx" x="0" y="208" width="270" height="46" rx="6"/><text class="t1" x="14" y="236.0">Track Application</text><rect class="bx" x="0" y="264" width="270" height="46" rx="6"/><text class="t1" x="14" y="284">Assisted Services</text><text class="t2" x="14" y="302">Find CSC · Assisted QR mode</text><rect class="bx" x="0" y="320" width="270" height="46" rx="6"/><text class="t1" x="14" y="340">Help &amp; Support</text><text class="t2" x="14" y="358">FAQs · Tutorials · Chatbot · Tickets</text><rect class="bx" x="0" y="376" width="270" height="46" rx="6"/><text class="t1" x="14" y="396">Settings</text><text class="t2" x="14" y="414">Profile · Security · Language · Data</text><rect class="bx" x="0" y="432" width="270" height="46" rx="6"/><text class="t1" x="14" y="460.0">Privacy &amp; Consent Center</text><rect class="bx" x="0" y="488" width="270" height="46" rx="6"/><text class="t1" x="14" y="516.0">About &amp; Policies</text><rect class="bx" x="0" y="544" width="270" height="46" rx="6" stroke-dasharray="5 4"/><text class="t1" x="14" y="564">Admin Portal</text><text class="t2" x="14" y="582">Dashboard · Monitoring · Audit logs</text><rect class="bx hi" x="620" y="40" width="280" height="102" rx="6"/><text class="t1" x="634" y="60">Apply</text><text class="t2" x="634" y="78">Choose · Details · Documents</text><text class="t2" x="634" y="95">Appointment (if needed) · Review</text><rect class="bx hi" x="620" y="152" width="280" height="46" rx="6"/><text class="t1" x="634" y="172">My Locker</text><text class="t2" x="634" y="190">View · Add · Share · Open</text><rect class="bx hi" x="620" y="208" width="280" height="46" rx="6"/><text class="t1" x="634" y="228">Track</text><text class="t2" x="634" y="246">A plain timeline</text><rect class="bx hi" x="620" y="264" width="280" height="102" rx="6"/><text class="t1" x="634" y="284">Help</text><text class="t2" x="634" y="302">Talk to a person · Seva Kendra</text><text class="t2" x="634" y="319">Assisted mode · Videos</text><rect class="bx hi" x="620" y="376" width="280" height="158" rx="6"/><text class="t1" x="634" y="396">Profile menu</text><text class="t2" x="634" y="414">Language · Voice help</text><text class="t2" x="634" y="431">Privacy and access log</text><text class="t2" x="634" y="448">Security · Your data</text><rect class="bx" x="620" y="544" width="280" height="46" rx="6" stroke-dasharray="5 4"/><text class="t1" x="634" y="564">Department portal</text><text class="t2" x="634" y="582">Separate tool, not in the citizen app</text></svg></div><p style="margin-top:20px;font-size:14px;color:var(--mute)">Each line shows where a section from my first site map went. Four choices sit on Home, one profile menu holds everything else, and the admin side leaves the citizen app.</p>`)}
${R(6,'The flow',`<h2>Five steps. Never more.</h2><p>The first version had seven steps. I merged personal details with address, and review with payment. Appointment only appears when a service needs one, so a PAN takes four.</p><div class="dlflow" style="margin-top:36px">${steps.map((t,k)=>`${k?'<i class="ln"></i>':''}<div class="nd2"><small>Step ${t[0]}</small><strong style="font-weight:300">${t[1]}</strong><p style="font-size:13px;color:var(--mute);margin-top:8px;max-width:none">${t[2]}</p></div>`).join('')}</div><p style="margin-top:36px">After step five you get a tracking ID. When the document is issued, it lands in My Locker by itself.</p><div style="overflow-x:auto;margin-top:36px"><svg class="svgd" viewBox="0 0 1000 340" role="img" aria-label="User flow in ten screens: language, home, choose, details, documents, appointment if needed, review, submitted, track, issued into My Locker" style="min-width:820px;width:100%;height:auto"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#8a8f98"/></marker></defs><path class="ln2" d="M160,70 L207,70" marker-end="url(#ar)"/><path class="ln2" d="M370,70 L417,70" marker-end="url(#ar)"/><path class="ln2" d="M580,70 L627,70" marker-end="url(#ar)"/><path class="ln2" d="M790,70 L837,70" marker-end="url(#ar)"/><path class="ln2" d="M160,274 L207,274" marker-end="url(#ar)"/><path class="ln2" d="M370,274 L417,274" marker-end="url(#ar)"/><path class="ln2" d="M580,274 L627,274" marker-end="url(#ar)"/><path class="ln2" d="M790,274 L837,274" marker-end="url(#ar)"/><path class="ln2" d="M920,106 L920,172 L80,172 L80,235" fill="none" marker-end="url(#ar)"/><rect class="bx" x="0" y="34" width="160" height="72" rx="6"/><text class="t3" x="14" y="56">SCREEN</text><text class="t1" x="14" y="78">Language</text><text class="t2" x="14" y="96">Hindi or English</text><rect class="bx" x="210" y="34" width="160" height="72" rx="6"/><text class="t3" x="224" y="56">SCREEN</text><text class="t1" x="224" y="78">Home</text><text class="t2" x="224" y="96">Four choices</text><circle cx="370" cy="34" r="12" class="bdg"/><text class="t4" x="370" y="38.5" text-anchor="middle">B</text><rect class="bx" x="420" y="34" width="160" height="72" rx="6"/><text class="t3" x="434" y="56">STEP 1</text><text class="t1" x="434" y="78">Choose</text><text class="t2" x="434" y="96">Pick a service</text><rect class="bx" x="630" y="34" width="160" height="72" rx="6"/><text class="t3" x="644" y="56">STEP 2</text><text class="t1" x="644" y="78">Details</text><text class="t2" x="644" y="96">From your locker</text><rect class="bx" x="840" y="34" width="160" height="72" rx="6"/><text class="t3" x="854" y="56">STEP 3</text><text class="t1" x="854" y="78">Documents</text><text class="t2" x="854" y="96">Pick what you hold</text><circle cx="1000" cy="34" r="12" class="bdg"/><text class="t4" x="1000" y="38.5" text-anchor="middle">A</text><rect class="bx" x="0" y="238" width="160" height="72" rx="6" stroke-dasharray="5 4"/><text class="t3" x="14" y="260">STEP 4</text><text class="t1" x="14" y="282">Appointment</text><text class="t2" x="14" y="300">Only if needed</text><circle cx="160" cy="238" r="12" class="bdg"/><text class="t4" x="160" y="242.5" text-anchor="middle">C</text><rect class="bx" x="210" y="238" width="160" height="72" rx="6"/><text class="t3" x="224" y="260">STEP 5</text><text class="t1" x="224" y="282">Review</text><text class="t2" x="224" y="300">See what is shared</text><rect class="bx" x="420" y="238" width="160" height="72" rx="6"/><text class="t3" x="434" y="260">SCREEN</text><text class="t1" x="434" y="282">Submitted</text><text class="t2" x="434" y="300">Tracking ID</text><rect class="bx" x="630" y="238" width="160" height="72" rx="6"/><text class="t3" x="644" y="260">SCREEN</text><text class="t1" x="644" y="282">Track</text><text class="t2" x="644" y="300">A plain timeline</text><rect class="bx" x="840" y="238" width="160" height="72" rx="6"/><text class="t3" x="854" y="260">SCREEN</text><text class="t1" x="854" y="282">Issued</text><text class="t2" x="854" y="300">Saved in My Locker</text></svg></div><ul class="leg"><li><b>A</b><span>No network: the form is kept on the phone and sent when the signal returns.</span></li><li><b>B</b><span>Needs a person: Help opens assisted mode. The operator fills the form with you and you approve on your own phone, then it rejoins at Review.</span></li><li><b>C</b><span>Some services have no appointment. A PAN skips this step, so it takes four.</span></li></ul>`)}
${R(7,'The journey',`<h2>Where Ramesh gets lost, and where he should not.</h2><p>His passport application, stage by stage. The grey line is how people described the current process. The coloured line is what I designed for. It is an expectation to test, not a measurement.</p><svg class="jm" viewBox="0 0 760 250" role="img" aria-label="Emotion curve for Ramesh: current process drops sharply at finding the site and uploading, the new design stays steady and ends high"><g stroke="currentColor" style="color:var(--line)"><line x1="40" y1="40" x2="740" y2="40"/><line x1="40" y1="125" x2="740" y2="125"/><line x1="40" y1="210" x2="740" y2="210"/></g><text x="0" y="44">Good</text><text x="0" y="214">Lost</text><polyline fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 5" points="90,110 220,190 350,150 480,200 610,130 700,175"/><polyline fill="none" stroke="var(--h)" stroke-width="3" points="90,120 220,95 350,85 480,110 610,70 700,52"/><g fill="var(--h)"><circle cx="90" cy="120" r="4"/><circle cx="220" cy="95" r="4"/><circle cx="350" cy="85" r="4"/><circle cx="480" cy="110" r="4"/><circle cx="610" cy="70" r="4"/><circle cx="700" cy="52" r="4"/></g><g text-anchor="middle"><text x="90" y="236">Start</text><text x="220" y="236">Find the site</text><text x="350" y="236">Fill</text><text x="480" y="236">Documents</text><text x="610" y="236">Submit</text><text x="700" y="236" dx="20">Wait</text></g></svg><p style="margin-top:20px">The biggest gap is at "Find the site" and "Documents": four websites on one side, and on the other a locker that already holds what is asked for. The end rises because of the consent receipt and the tracking ID.</p>`)}
${R(8,'The design system',`<h2>One system, so every screen feels like one app.</h2><p>Colour, type and spacing are decided once, then reused. The board shows the tokens and the components built from them.</p><figure style="margin:32px 0 0"><img src="${IMG.pDS}" alt="Design system board: colours, type scale in English and Hindi, spacing, radius, elevation, buttons, chips, fields and tab bar" loading="lazy" decoding="async" style="width:100%;display:block;border-radius:6px"></figure><p style="margin-top:28px">Three decisions did most of the work. Teal means action, and saffron only means where you are or what is new, so the eye always knows where to go. Everything sits on a 4-point grid. And Hindi is set at the same size as English, with more line height, because the script needs it.</p><h3 style="font-weight:300;font-size:13px;color:var(--mute);margin:40px 0 0">Contrast, measured (WCAG 2.x)</h3><table class="tbl"><tr><th>Pair</th><th>Ratio</th><th>Needs</th></tr><tr><td>Main text on paper</td><td>14.5 : 1</td><td>4.5</td></tr><tr><td>Secondary text on paper</td><td>7.0 : 1</td><td>4.5</td></tr><tr><td>White on the teal button</td><td>9.5 : 1</td><td>4.5</td></tr><tr><td>"Verified" label, green on pale green</td><td>6.1 : 1</td><td>4.5</td></tr></table><p style="margin-top:20px">The smallest text is 14px, in captions, chips and tab labels.</p>`)}
${R(9,'The screens',`<h2>Built for the person with the least patience.</h2><p>I built this idea twice. The first prototype was a website, and it tested the flow. The app is the final design: mobile first, in Hindi and English, with everything DigiLocker does today and Apply added on top.</p><div class="lt" role="group" aria-label="Language"><button class="on" data-l="hi">हिन्दी</button><button data-l="en">English</button></div>${[["Start and settings", [["lang", "Language first, in your own script"], ["home", "Home: four choices, and what is in progress"], ["apply", "Choose: what do you need?"], ["profile", "Profile: language, voice, text size, privacy"]]], ["Kept from today: your locker", [["locker", "My Locker: view what you hold"], ["doc", "Open a document: share, download, see who viewed it"], ["add", "Add a document: fetch, scan or upload"]]], ["The five steps", [["s2", "Step 2 \u00b7 Details, filled from the locker"], ["s3", "Step 3 \u00b7 Documents, with an offline state"], ["s5", "Step 5 \u00b7 Review and consent"], ["done", "Submitted: a tracking ID"]]], ["After, and beside", [["track", "Track: a plain timeline"], ["help", "Help: a person, a centre, a video"], ["assist", "Assisted mode for a Seva Kendra operator"], ["log", "Who saw my data, with Withdraw access"]]]].map(g=>`<h3 class="gh">${g[0]}</h3><div class="dph">${g[1].map(a=>`<figure><img class="fs" data-k="${a[0]}" src="${IMG['f_'+a[0]+'_hi']}" alt="${a[1]}" loading="lazy" decoding="async"><figcaption>${a[1]}</figcaption></figure>`).join('')}</div>`).join('')}<p style="margin-top:28px;font-size:13px;color:var(--mute)">Step 4, the appointment, only appears for services that need one. It is not built in this prototype, and step 1 is the Choose screen.</p>`)}
${R(10,'How it would start',`<h2>Begin with two services, in a few districts.</h2><p>A pilot with PAN and Passport, because PAN is quick to automate and Passport already accepts DigiLocker documents. Two or three urban and two or three rural districts, with trained Jan Seva Kendra operators and local-language guides.</p><p>Success is measured for three months: how many finish, how long it takes, and how many still need help. Then the screens and the integration are fixed before anything grows.</p>`)}
${R(11,'What I would do differently',`<p>The survey reached too few small-town and village users, and the prototype has not been tested with the people it is meant for. The next step is to sit with five first-time users at a Jan Seva Kendra, watch them work through the five steps in their own language, and change what breaks.</p><p>I drafted the Hindi myself. It needs a native reader before anyone trusts it, and a third, local language is still open. The persona and journey work comes from survey answers, so it needs interviews to become real.</p><!-- [ADD ONE MORE REAL LESSON FROM THE PROJECT] -->${p.pdf?`<p style="margin-top:28px"><a href="${p.pdf}" class="top" style="color:var(--ink);border-bottom:1px solid var(--line)">Read the full thesis (PDF) ↗</a></p>`:''}`)}

<div class="hd2"><h1 style="font-size:clamp(56px,13vw,200px)">Soul</h1><p class="sub" style="max-width:30ch">Jal Mahal, Jaipur. Morning. Slow shutter.</p></div>
<div class="facts"><div><small>Series</small>Soul</div><div><small>Place</small>Jal Mahal, Jaipur</div><div><small>Light</small>Morning</div><div><small>Camera</small>Sony A7 III</div></div>
<div class="sg">${f(1,'1/-1')}
<div class="lbl" style="grid-column:1/5">The idea</div><p class="lead" style="grid-column:6/-1">I wanted to show the soul of people and pigeons, not just how they look. A slow shutter lets them move through the frame, so what stays is presence instead of detail.</p>
${f(2,'1/8')}${f(3,'8/-1','align-self:end')}${f(4,'4/-1')}
<div class="lbl" style="grid-column:1/5">How</div><div style="grid-column:6/-1;max-width:48ch"><p class="lead" style="font-size:20px">Shot early in the morning, when the light is soft and the place is quiet. Anything still stays readable, and anything alive becomes a trace.</p><p style="margin-top:16px;color:var(--mute)">Sony A7 III · Sony 28–70mm kit lens · shutter approx. 1/8–1/10 s · [ADD APERTURE · ISO]</p><p style="margin-top:16px;color:var(--mute)">Edited lightly: colour correction and basic adjustments, no heavy grading. I wanted to keep the natural look.</p></div>
${f(5,'1/8')}${f(6,'8/-1','margin-top:96px')}

/* ---------- Experiments: Kal Bhairav's two face renders, calm and ignited, laid over each other. The pointer is a lens that ignites
   the face where it passes, which is how the piece itself works (a crossfade between two real textures, never an added glow). ---------- */
function expIdx(d){const p=d.p[0];if(!p)return `<div class="dx ex">${dxHead(d)}</div>${contact()}`;
 const facts=[['Role',p.role],['Format',p.fmt],['Year',p.yr]].filter(f=>dxOk(f[1]));
 return `<div class="dx ex">${dxHead(d,'One finished study so far. Built in the browser, driven by sound.')}
<section class="exst" aria-label="Kal Bhairav: the calm and ignited renders"><div class="exl" id="exl"><img src="${IMG.kalCalm}" alt="Shiva, calm: the base hero art of Kal Bhairav" decoding="async" fetchpriority="high"><img class="exb" src="${IMG.kalBlaze}" alt="" aria-hidden="true" decoding="async"></div>
<p class="exhint" id="exhint">Move across the face to ignite it.</p><button type="button" class="exig" id="exig" aria-pressed="false">Ignite the third eye</button></section>
<section class="exinfo"><div class="exti"><p class="exk">01 / 01</p><h2>${p.t}</h2><p class="exm">${p.m}.</p><p class="exq">Two hand-finished renders of Shiva are the only face art. Igniting the third eye is a crossfade between them, never an added glow.</p>
<dl class="exf">${facts.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join('')}</dl><p class="exgo"><a href="#/work/${d.k}/${p.sl}">Open the piece <span aria-hidden="true">→</span></a></p></div>
<figure class="exv"><div class="exvf"><video id="exv" muted loop playsinline preload="none" poster="${IMG.kalCard}" aria-label="Silent preview of Kal Bhairav"></video><button type="button" class="mopp is-paused" id="expp" aria-label="Play preview"><span aria-hidden="true"></span></button></div><figcaption>A silent preview, looped. The full piece runs with sound and live beat detection on its own page.</figcaption></figure></section></div>${contact()}`}
function expInit(){const L=$('#exl');if(!L)return;const ig=$('#exig'),vid=$('#exv'),pp=$('#expp');let lx=.5,ly=.42,tx=.5,ty=.42,r=0,tr=0,full=false;
 const draw=()=>{DX.raf=0;lx+=(tx-lx)*.16;ly+=(ty-ly)*.16;r+=(tr-r)*.14;L.style.setProperty('--mx',(lx*100).toFixed(2)+'%');L.style.setProperty('--my',(ly*100).toFixed(2)+'%');L.style.setProperty('--r',r.toFixed(1)+'px');
  if(Math.abs(tx-lx)>.001||Math.abs(ty-ly)>.001||Math.abs(tr-r)>.5)DX.raf=requestAnimationFrame(draw)};
 const kick=()=>{if(reduce){lx=tx;ly=ty;r=tr;L.style.setProperty('--mx',lx*100+'%');L.style.setProperty('--my',ly*100+'%');L.style.setProperty('--r',r+'px');return}if(!DX.raf)DX.raf=requestAnimationFrame(draw)};
 const big=()=>Math.hypot(L.clientWidth,L.clientHeight);
 const at=e=>{const b=L.getBoundingClientRect();tx=Math.min(1,Math.max(0,(e.clientX-b.left)/b.width));ty=Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))};
 if(!reduce){dxOn(L,'pointermove',e=>{at(e);if(!full)tr=Math.min(L.clientWidth,L.clientHeight)*.3;L.classList.add('used');kick()});
  dxOn(L,'pointerdown',e=>{at(e);if(!full)tr=Math.min(L.clientWidth,L.clientHeight)*.3;L.classList.add('used');kick()});
  dxOn(L,'pointerleave',e=>{if(!full&&e.pointerType!=='touch'){tr=0;kick()}})}
 dxOn(ig,'click',()=>{full=!full;ig.setAttribute('aria-pressed',full);ig.textContent=full?'Let it settle':'Ignite the third eye';tx=.5;ty=.4;tr=full?big():0;kick()});
 const sync=()=>{const p=vid.paused;pp.classList.toggle('is-paused',p);pp.setAttribute('aria-label',p?'Play preview':'Pause preview')};
 dxOn(pp,'click',()=>{if(!vid.getAttribute('src'))vid.src=$('.ex .exgo a')?D.find(x=>x.k==='experiments').p[0].vid:'';vid.paused?vid.play().catch(()=>{}):vid.pause()});dxOn(vid,'play',sync);dxOn(vid,'pause',sync);DX.vids.push(vid);
 /* the preview loads and plays only once it is on screen, and never by itself under reduced motion */
 if(!reduce&&'IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){if(!vid.getAttribute('src'))vid.src=D.find(x=>x.k==='experiments').p[0].vid;vid.play().catch(()=>{})}else vid.pause()}),{threshold:.35});io.observe(vid);DX.ev.push([{removeEventListener:()=>io.disconnect()},'io',null])}}

const CL=[[0,0,13,-1],[0,15,16,0],[0,33,10,-1],[0,45,14,3],[0,61,12,-1],[0,75,25,5],[1,4,18,-1],[1,24,14,1],[1,40,20,-1],[1,62,16,4],[1,80,20,-1],[2,10,22,2],[2,36,12,-1],[2,52,20,-1],[2,76,24,-1]];

 const els=CL.map(([t,l,w,d])=>{const c=document.createElement('div');c.className='clip';c.style.cssText=`top:${t*30+3.5}%;left:${l}%;width:${w-1}%`;if(d>=0&&!D[d].hide){c.style.setProperty('--c',D[d].h);c.innerHTML=`<span>${D[d].n}</span>`}panel.appendChild(c);return{c,l,d}});
 const start=performance.now(),dur=(()=>{try{const v=sessionStorage.getItem('pv_seen');sessionStorage.setItem('pv_seen','1');return v?520:1300}catch(e){return 1300}})(),ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
 function end(){if(done)return;done=true;const st=$('#stage');
  const VD=D.filter(d=>!d.hide);
  const fl=els.filter(x=>x.d>=0&&!D[x.d].hide).map(x=>{const vi=VD.indexOf(D[x.d]),r=x.c.getBoundingClientRect(),o=st&&$(`.obj[data-i="${vi}"]`);if(!o)return null;const nd=o.querySelector('.nd'),sr=st.getBoundingClientRect(),tx=sr.left+o.offsetLeft,ty=sr.top+o.offsetTop,tw=nd.offsetWidth,th=nd.offsetHeight,f=document.createElement('div');f.className='fly';f.style.cssText=`left:${tx}px;top:${ty}px;width:${tw}px;height:${th}px;transform-origin:0 0;background:color-mix(in srgb,${D[x.d].h} 28%,var(--s1));border:1px solid var(--line)`;document.body.appendChild(f);
   f.animate([{transform:`translate(${r.left-tx}px,${r.top-ty}px) scale(${r.width/tw},${r.height/th})`},{transform:'none'}],{duration:620,easing:EZ,fill:'both'});return f}).filter(Boolean);
  panel.style.opacity=0;$('#skip').style.display='none';
  setTimeout(()=>{ready();fl.forEach(f=>{f.animate([{opacity:1},{opacity:0}],{duration:520,delay:170,fill:'forwards'});setTimeout(()=>f.remove(),760)})},440)}
 function tick(now){if(done)return;const p=Math.min((now-start)/dur,1),e=ease(p)*100;pl.style.left=e+'%';
  els.forEach(x=>x.c.classList.toggle('lit',e>=x.l));p<1?requestAnimationFrame(tick):setTimeout(end,100)}
 $('#skip').onclick=()=>{done=true;els.forEach(x=>x.c.remove());ready()};requestAnimationFrame(tick)}
envInit();route();
